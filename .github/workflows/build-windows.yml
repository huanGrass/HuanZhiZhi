name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install project and build dependencies
        run: python -m pip install . "PyInstaller>=6.5,<7"

      - name: Build from existing spec
        run: python -m PyInstaller --noconfirm "幻之之.spec"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: HuanZhiZhi-windows-x64
          path: dist/幻之之
          if-no-files-found: error
